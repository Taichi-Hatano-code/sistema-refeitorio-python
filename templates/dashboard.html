<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Sistema</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }

        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 20px;
            min-height: 100vh;
        }

        /* --- BARRA SUPERIOR --- */
        .top-bar {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 15px;
        }

        .btn-top {
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: 0.3s;
            border: 1px solid;
            display: flex;
            align-items: center;
            gap: 5px;
            font-weight: bold;
        }

        .btn-admin { border-color: #bb86fc; color: #bb86fc; }
        .btn-admin:hover { background: #bb86fc; color: #000; }
        .btn-logout { border-color: #cf6679; color: #cf6679; }
        .btn-logout:hover { background: #cf6679; color: #000; }

        /* --- CONTEÚDO --- */
        h1 { font-weight: 300; margin-bottom: 10px; margin-top: 20px; text-align: center; }
        .subtitle { color: #888; margin-bottom: 30px; text-align: center; }

        .container {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            max-width: 1000px;
            width: 100%;
        }

        /* Estilo dos Cards (Padrão Desktop) */
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 250px;
            border: 1px solid #333;
            transition: transform 0.3s, border-color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .card:hover { transform: translateY(-5px); border-color: #fff; }
        .icon { font-size: 4rem; display: block; margin-bottom: 15px; }
        .card h2 { margin-bottom: 20px; color: #fff; font-weight: 400; }
        
        button {
            background-color: transparent;
            border: 2px solid #fff;
            color: #fff;
            padding: 10px 25px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
            width: 100%;
        }

        /* Cores Específicas */
        .cafe:hover button { background-color: #ffce56; color: #000; border-color: #ffce56; }
        .almoco:hover button { background-color: #4bc0c0; color: #000; border-color: #4bc0c0; }
        .janta:hover button { background-color: #9966ff; color: #000; border-color: #9966ff; }

        .flash-container { width: 100%; max-width: 600px; margin-bottom: 20px; }
        .flash-msg {
            background-color: rgba(3, 218, 198, 0.2);
            border: 1px solid #03dac6;
            color: #03dac6;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            margin-bottom: 10px;
        }

        /* --- MOBILE OTIMIZADO (O Segredo está aqui) --- */
        @media (max-width: 768px) {
            body {
                padding: 10px;
                justify-content: center; /* Centraliza verticalmente */
            }

            h1 { font-size: 1.5rem; margin-top: 50px; } /* Ajuste por causa do botão sair */
            .subtitle { display: none; } /* Remove subtítulo para economizar espaço */

            .container {
                flex-direction: column; /* Empilha um embaixo do outro */
                gap: 15px;
                width: 100%;
            }

            /* Transforma o Card Quadrado em uma Barra Horizontal */
            .card {
                width: 100%;
                height: 80px; /* Altura fixa pequena */
                flex-direction: row; /* Ícone do lado do texto */
                justify-content: space-between; /* Espalha os itens */
                padding: 0 20px;
                margin-bottom: 0;
            }

            .icon {
                font-size: 2.5rem; /* Ícone menor */
                margin-bottom: 0;
                margin-right: 15px;
            }

            .card h2 {
                font-size: 1.2rem;
                margin-bottom: 0;
                text-align: left;
                flex-grow: 1; /* Ocupa o espaço do meio */
            }

            form { width: auto; }
            button {
                padding: 8px 15px;
                font-size: 0.9rem;
                width: auto; /* Botão fica pequeno */
            }
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <a href="{{ url_for('paineladm') }}" class="btn-top btn-admin">⚙️ <span class="mobile-hide">Admin</span></a>
        <a href="{{ url_for('logout') }}" class="btn-top btn-logout">🚪 <span class="mobile-hide">Sair</span></a>
    </div>

    <h1>Olá, {{ current_user.nome.split()[0] }}!</h1>
    <p class="subtitle">Registre seu ponto abaixo:</p>

    <div class="flash-container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-msg">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <div class="container">
        
        <div class="card cafe">
            <span class="icon">☕</span>
            <h2>Café</h2>
            <form action="{{ url_for('registrar_refeicao') }}" method="POST">
                <input type="hidden" name="tipo_refeicao" value="Café">
                <button type="submit">Registrar</button>
            </form>
        </div>

        <div class="card almoco">
            <span class="icon">🍽️</span>
            <h2>Almoço</h2>
            <form action="{{ url_for('registrar_refeicao') }}" method="POST">
                <input type="hidden" name="tipo_refeicao" value="Almoço">
                <button type="submit">Registrar</button>
            </form>
        </div>

        <div class="card janta">
            <span class="icon">🍲</span>
            <h2>Jantar</h2>
            <form action="{{ url_for('registrar_refeicao') }}" method="POST">
                <input type="hidden" name="tipo_refeicao" value="Jantar">
                <button type="submit">Registrar</button>
            </form>
        </div>

    </div>

</body>
</html>
