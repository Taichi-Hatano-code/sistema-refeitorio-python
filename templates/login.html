<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema</title>
    <style>
        /* Reset básico */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

        body {
            background-color: #121212; /* Preto fundo */
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            background-color: #1e1e1e; /* Cinza escuro */
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #333;
        }

        .login-card h2 { margin-bottom: 20px; font-weight: 300; letter-spacing: 1px; }

        .form-group { margin-bottom: 20px; text-align: left; }

        label { display: block; margin-bottom: 8px; font-size: 0.9em; color: #aaa; }

        input {
            width: 100%;
            padding: 12px;
            background-color: #2c2c2c;
            border: 1px solid #444;
            border-radius: 6px;
            color: white;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: #bb86fc; background-color: #333; }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #6200ea, #3700b3); /* Roxo neon */
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(98, 0, 234, 0.4); }

        .flash-msg {
            background-color: #cf6679;
            color: #121212;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 0.9em;
        }
        
        .footer-link { margin-top: 20px; display: block; font-size: 0.8em; color: #666; text-decoration: none; }
        .footer-link:hover { color: #bb86fc; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Acesso Restrito</h2>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="flash-msg">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="form-group">
                <label>CPF ou Usuário</label>
                <input type="text" name="username" placeholder="000.000.000-00" required>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" name="password" placeholder="•••••••" required>
            </div>

            <button type="submit">Entrar</button>
        </form>

        <a href="/" class="footer-link">Voltar para Início</a>
    </div>

</body>
</html>
