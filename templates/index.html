<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Corporativo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            /* O Jinja2 vai criar o link certo automaticamente */
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url("{{ url_for('static', filename='gambarra.jpg') }}");
            
            background-size: cover;
            background-position: center;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Barra superior */
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            gap: 15px;
        }

        .btn-adm, .btn-login {
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .btn-login { background-color: #03dac6; color: #000; border: none; font-weight: bold; }
        .btn-adm:hover { background: white; color: black; }
        .btn-login:hover { transform: scale(1.05); }

        /* Container Principal */
        .main-content {
            text-align: center;
            margin-top: 20px;
            width: 100%;
            max-width: 800px; /* Limita a largura para não esticar demais */
        }

        h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 2px 2px 10px black; }
        p { font-size: 1.2rem; color: #ccc; margin-bottom: 30px; }

        /* O Card do Gráfico (Efeito Vidro) */
        .chart-container {
            background: rgba(30, 30, 30, 0.8); /* Fundo escuro transparente */
            backdrop-filter: blur(10px);        /* Desfoque atrás */
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin: 0 auto; /* Centraliza */
            width: 100%;
            max-width: 600px; /* Tamanho do gráfico */
        }

        .status-badge {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="top-nav">
        {% if current_user.is_authenticated %}
            {% if current_user.cargo.lower() == 'admin' %}
                <a href="/paineladm" class="btn-adm">⚙️ Gerenciar</a>
             {% endif %}
            <div class="status-badge">🟢 {{ current_user.nome }}</div>
            <a href="/logout" class="btn-adm" style="border-color: #cf6679; color:#cf6679;">Sair</a>
        {% else %}
            <a href="/login" class="btn-login">Fazer Login</a>
        {% endif %}
    </div>

    <div class="main-content">
        <h1>Refeitório Corporativo</h1>
        <p>Acompanhe o consumo diário em tempo real.</p>

        <div class="chart-container">
            <canvas id="graficoHome"></canvas>
        </div>
    </div>

    <script>
        // Truque para o VS Code não marcar erro
        const vCafe = Number("{{ dados['Cafe'] }}");
        const vAlmoco = Number("{{ dados['Almoco'] }}");
        const vJantar = Number("{{ dados['Jantar'] }}");

        const ctx = document.getElementById('graficoHome').getContext('2d');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Café', 'Almoço', 'Jantar'],
                datasets: [{
                    label: 'Refeições Hoje',
                    data: [vCafe, vAlmoco, vJantar],
                    backgroundColor: [
                        'rgba(255, 206, 86, 0.8)', // Amarelo
                        'rgba(75, 192, 192, 0.8)', // Verde
                        'rgba(255, 99, 132, 0.8)'  // Vermelho/Rosa
                    ],
                    borderColor: [
                        'rgba(255, 206, 86, 1)',
                        'rgba(75, 192, 192, 1)',
                        'rgba(255, 99, 132, 1)'
                    ],
                    borderWidth: 1,
                    borderRadius: 5 // Barras arredondadas
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { display: false }, // Esconde a legenda para ficar mais limpo
                    title: {
                        display: true,
                        text: 'Consumo do Dia (' + new Date().toLocaleDateString('pt-BR') + ')',
                        color: '#fff',
                        font: { size: 16 }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        grid: { color: 'rgba(255,255,255,0.1)' },
                        ticks: { color: '#ddd', stepSize: 1 }
                    },
                    x: {
                        grid: { display: false },
                        ticks: { color: '#ddd', font: {size: 14} }
                    }
                }
            }
        });
    </script>

</body>
</html>
