<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Corporativo</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            /* O Jinja2 vai criar o link certo automaticamente */
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url("{{ url_for('static', filename='gambarra.jpg') }}");
            
            background-size: cover;
            background-position: center;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        /* Barra superior */
        .top-nav {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 20px;
            gap: 15px;
        }

        .btn-adm, .btn-login {
            text-decoration: none;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.5);
            transition: 0.3s;
        }
        .btn-login { background-color: #03dac6; color: #000; border: none; font-weight: bold; }
        .btn-adm:hover { background: white; color: black; }
        .btn-login:hover { transform: scale(1.05); }

        /* Container Principal */
        .main-content {
            text-align: center;
            margin-top: 20px;
            width: 100%;
            max-width: 800px; /* Limita a largura para não esticar demais */
        }

        h1 { font-size: 3rem; margin-bottom: 10px; text-shadow: 2px 2px 10px black; }
        p { font-size: 1.2rem; color: #ccc; margin-bottom: 30px; }

        /* O Card do Gráfico (Efeito Vidro) */
        .chart-container {
            background: rgba(30, 30, 30, 0.8); /* Fundo escuro transparente */
            backdrop-filter: blur(10px);        /* Desfoque atrás */
            padding: 20px;
            border-radius: 15px;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            margin: 0 auto; /* Centraliza */
            width: 100%;
            max-width: 600px; /* Tamanho do gráfico */
        }

        .status-badge {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <div class="top-nav">
        {% if current_user.is_authenticated %}
            {% if current_user.cargo.lower() == 'admin' %}
                <a href="/paineladm" class="btn-adm">⚙️ Gerenciar</a>
             {% endif %}
            <div class="status-badge">🟢 {{ current_user.nome }}</div>
            <a href="/logout" class="btn-adm" style="border-color: #cf6679; color:#cf6679;">Sair</a>
        {% else %}
            <a href="/login" class="btn-login">Fazer Login</a>
        {% endif %}
    </div>

    <div class="main-content">
        <h1>Refeitório Corporativo</h1>
        <p>Acompanhe o consumo diário em tempo real.</p>

        <div class="chart-container">
            <canvas id="graficoHome"></canvas>
        </div>
    </div>

    <script>
    // 1. Recebe os dados do Python convertidos para JSON real
    const dadosEmpresas = {{ dados | tojson }};

    // 2. Cores pré-definidas para as empresas (adicione mais se precisar)
    const cores = [
        '#FF6384', // Vermelho
        '#36A2EB', // Azul
        '#FFCE56', // Amarelo
        '#4BC0C0', // Verde Água
        '#9966FF', // Roxo
        '#FF9F40'  // Laranja
    ];

    // 3. Monta os Datasets dinamicamente
    const datasets = [];
    let i = 0;

    for (const [empresa, valores] of Object.entries(dadosEmpresas)) {
        datasets.push({
            label: empresa,          // Nome da Empresa aparece na legenda
            data: valores,           // [QtdCafe, QtdAlmoco, QtdJantar]
            backgroundColor: cores[i % cores.length], // Pega uma cor da lista (ciclando)
            borderWidth: 1,
            borderRadius: 4
        });
        i++;
    }

    const ctx = document.getElementById('graficoHome').getContext('2d');

    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['Café', 'Almoço', 'Jantar'], // As colunas
            datasets: datasets // Nossos dados organizados por empresa
        },
        options: {
            responsive: true,
            plugins: {
                legend: { 
                    display: true, // Agora mostramos a legenda para saber quem é quem
                    labels: { color: '#fff' }
                }, 
                title: {
                    display: true,
                    text: 'Consumo por Empresa (' + new Date().toLocaleDateString('pt-BR') + ')',
                    color: '#fff',
                    font: { size: 16 }
                }
            },
            scales: {
                x: {
                    stacked: true, // <--- O PULO DO GATO: Empilha as barras
                    grid: { display: false },
                    ticks: { color: '#ddd', font: {size: 14} }
                },
                y: {
                    stacked: true, // <--- Empilha no eixo Y também
                    beginAtZero: true,
                    grid: { color: 'rgba(255,255,255,0.1)' },
                    ticks: { color: '#ddd', stepSize: 1 }
                }
            }
        }
    });
    </script>

</body>
</html>
