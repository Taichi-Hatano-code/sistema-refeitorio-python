<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-vindo</title>
    <style>
        /* Estilo Dark igual ao login */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body {
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://images.unsplash.com/photo-1495147466023-ac5c588e2e94?q=80&w=1000&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 { font-size: 3.5rem; margin-bottom: 10px; text-shadow: 2px 2px 10px black; }
        p { font-size: 1.2rem; color: #ccc; margin-bottom: 30px; max-width: 600px; }

        .btn {
            padding: 15px 40px;
            font-size: 1.2rem;
            text-decoration: none;
            color: white;
            border-radius: 50px;
            transition: 0.3s;
            font-weight: bold;
        }

        .btn-primary {
            background-color: #03dac6; /* Verde Azulado Neon */
            color: #121212;
        }
        
        .btn-primary:hover { background-color: #00b3a3; transform: scale(1.05); }

        .status-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 20px;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    {% if current_user.is_authenticated %}
        <div class="status-badge">🟢 Logado como {{ current_user.nome }}</div>
    {% endif %}

    <h1>Portal Corporativo</h1>
    <p>Gerencie suas refeições e acesse o painel de controle de forma rápida e segura.</p>

    {% if current_user.is_authenticated %}
        <a href="/dashboard" class="btn btn-primary">Acessar Meu Painel</a>
    {% else %}
        <a href="/login" class="btn btn-primary">Fazer Login</a>
    {% endif %}

</body>
</html>
